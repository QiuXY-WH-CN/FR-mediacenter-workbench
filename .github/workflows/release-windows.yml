name: Windows release

on:
  push:
    branches: ['codex/release/v*']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      NODE_VERSION: '24.21.0'
      PNPM_VERSION: '11.25.0'
      INNO_VERSION: '6.7.1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify release version
        shell: pwsh
        run: |
          $package = Get-Content -LiteralPath web/package.json -Raw | ConvertFrom-Json
          $tag = 'v' + $package.version
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid release version.' }
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -notin @("refs/tags/$tag", "refs/heads/codex/release/$tag")) {
            throw 'Ref does not match the package version.'
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RELEASE_TAG=$tag"
      - name: Install and verify
        shell: pwsh
        run: |
          npm install --global "pnpm@$env:PNPM_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir web install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/privacy-audit.mjs --strict
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir web run verify
      - name: Package Windows x64
        shell: pwsh
        run: |
          choco install innosetup --version="$env:INNO_VERSION" --yes --no-progress
          if ($LASTEXITCODE -notin @(0, 1641, 3010)) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/release-windows.ps1
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $notes = Join-Path $env:RUNNER_TEMP 'workbench-release.md'
          $changelog = Get-Content -LiteralPath CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, "(?ms)^## $([regex]::Escape($tag)) .+?\r?\n(.*?)(?=^## |\z)")
          if (!$section.Success) { throw "Change log for $tag is missing." }
          $section.Groups[1].Value.Trim() | Set-Content -LiteralPath $notes -Encoding utf8
          $artifacts = @(
            "发布版/FengruWorkbench-$tag-win-x64-setup.exe"
            "发布版/FengruWorkbench-$tag-win-x64.zip"
            "发布版/FengruWorkbench-$tag-win-x64-SHA256SUMS.txt"
          )
          foreach ($path in $artifacts) {
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing release asset $path" }
          }
          gh release create $tag @artifacts --target $env:GITHUB_SHA --title $tag --notes-file $notes
